# Fluss Streaming Example with Real-time Processing

env {
  execution.parallelism = 4
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  Fluss {
    bootstrap.servers = "localhost:9123"
    database = "user_events"
    table = "click_stream"
    
    # Define the schema for the source table
    schema = {
      fields {
        user_id = "string"
        event_type = "string"
        timestamp = "timestamp"
        page_url = "string"
        session_id = "string"
        ip_address = "string"
        user_agent = "string"
      }
    }
    
    # Start reading from the latest data
    scan.startup.mode = "latest"
    enable.changelog = true
    consumer.group = "seatunnel-analytics"
    
    # Performance settings for high-throughput scenarios
    fetch.size = 5000
    poll.timeout.ms = 1000
    scan.parallelism = 4
    
    # Connection settings
    connection.timeout.ms = 30000
    request.timeout.ms = 30000
    retry.times = 5
    retry.interval.ms = 1000
    
    # Additional Fluss configuration for authentication (if needed)
    fluss.config = {
      "client.security.protocol" = "sasl"
      "client.security.sasl.mechanism" = "PLAIN"
      "client.security.sasl.username" = "analytics_user"
      "client.security.sasl.password" = "analytics_password"
    }
  }
}

transform {
  # Add processing timestamp
  Sql {
    sql = """
      SELECT 
        user_id,
        event_type,
        timestamp as event_timestamp,
        page_url,
        session_id,
        ip_address,
        user_agent,
        CURRENT_TIMESTAMP as processing_timestamp
      FROM source
      WHERE event_type IN ('click', 'view', 'purchase')
    """
  }
}

sink {
  Fluss {
    bootstrap.servers = "localhost:9123"
    database = "analytics"
    table = "processed_events"
    
    # Use upsert mode for primary key table
    write.mode = "upsert"
    
    # Batch settings for optimal performance
    batch.size = 2000
    batch.timeout.ms = 2000
    max.retries = 5
    
    # Enable transactions for exactly-once semantics
    enable.transaction = true
    enable.exactly.once = true
    transactional.id.prefix = "seatunnel-analytics"
    transaction.timeout = "10min"
    
    # Connection settings
    connection.timeout.ms = 30000
    request.timeout.ms = 30000
    retry.times = 5
    retry.interval.ms = 2000
    
    # Same authentication as source
    fluss.config = {
      "client.security.protocol" = "sasl"
      "client.security.sasl.mechanism" = "PLAIN"
      "client.security.sasl.username" = "analytics_user"
      "client.security.sasl.password" = "analytics_password"
    }
  }
}
