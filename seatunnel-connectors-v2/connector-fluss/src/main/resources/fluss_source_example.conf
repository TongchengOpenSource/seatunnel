# Fluss Source Configuration Example

env {
  # You can set engine configuration here
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Fluss {
    bootstrap.servers = "localhost:9092"
    database = "test_db"
    table = "test_table"

    # Schema definition (optional - if not provided, will use simple text schema)
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
        timestamp = "bigint"
      }
    }

    # Scan configuration
    scan.startup.mode = "earliest"  # earliest, latest, timestamp
    # scan.startup.timestamp = 1640995200000  # Only for timestamp mode

    # Performance tuning
    fetch.size = 1000
    poll.timeout.ms = 5000
    scan.parallelism = 2

    # Streaming configuration
    enable.changelog = false
    # consumer.group = "seatunnel-group"

    # Connection configuration
    connection.timeout.ms = 30000
    request.timeout.ms = 30000
    retry.times = 3
    retry.interval.ms = 1000

    # Additional Fluss configuration
    # fluss.config = {
    #   "custom.property" = "value"
    # }
  }
}

transform {
  # If you need any transformations
}

sink {
  Console {
    # For testing purposes, printing to console
  }
}
