# Fluss to Fluss demo

env {
  execution.parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  # Read from source Fluss table
  Fluss {
    bootstrap.servers = "source-fluss:9092"
    database = "source_db"
    table = "source_table"
    
    # Stream from latest data
    scan.startup.mode = "latest"
    enable.changelog = true
    consumer.group = "seatunnel-consumer"
    
    # Performance settings
    fetch.size = 2000
    poll.timeout.ms = 3000
    scan.parallelism = 2
  }
}

transform {
  # Add data transformation if needed
  # Filter {
  #   include_fields = ["id", "name", "timestamp"]
  # }
}

sink {
  # Write to target Fluss table
  Fluss {
    bootstrap.servers = "target-fluss:9092"
    database = "target_db"
    table = "target_table"
    
    # Write configuration
    write.mode = "upsert"
    batch.size = 1500
    batch.timeout.ms = 3000
    
    # Enable exactly-once semantics
    enable.transaction = true
    enable.exactly.once = true
    transactional.id.prefix = "seatunnel-etl"
    
    # Retry configuration
    max.retries = 5
    retry.times = 3
    retry.interval.ms = 2000
  }
}
