# Fluss Source Configuration Examples
# This file demonstrates various ways to configure the Fluss source connector
# with different offset initialization strategies.

# Example 1: Full snapshot mode (default) - Minimal configuration
# This mode performs a full snapshot on the table upon first startup,
# then continues to read the changelog.
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "my_database"
  table = "my_table"
  # scan.startup.mode = "full"  # This is the default, can be omitted
}

# Example 2: Earliest offset mode
# Start reading from the earliest available offset in each bucket
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "my_database"
  table = "my_table"
  scan.startup.mode = "earliest"
  # Useful for processing all historical data
}

# Example 3: Latest offset mode
# Start reading from the latest offset, only processing new data
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "my_database"
  table = "my_table"
  scan.startup.mode = "latest"
  # Useful for real-time processing of new data only
}

# Example 4: Timestamp mode with numeric timestamp
# Start reading from a specific timestamp (milliseconds since epoch)
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "my_database"
  table = "my_table"
  scan.startup.mode = "timestamp"
  scan.startup.timestamp = 1678883047356
  # Useful for replaying data from a specific point in time
}

# Example 5: Timestamp mode with formatted timestamp
# Start reading from a specific timestamp using human-readable format
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "my_database"
  table = "my_table"
  scan.startup.mode = "timestamp"
  scan.startup.timestamp = "2023-03-15 10:30:47"
  # Format: yyyy-MM-dd HH:mm:ss
}

# Example 6: Complete configuration with Fluss-specific options
source {
  plugin_name = "Fluss"

  # Required connection settings
  bootstrap.servers = "localhost:9092"
  database = "my_database"
  table = "my_table"

  # Offset initialization
  scan.startup.mode = "full"
  # scan.startup.timestamp = "2023-03-15 10:30:47"  # Only needed for timestamp mode

  # Bucket configuration (optional)
  bucket.num = 16
  bucket.key = "user_id,region"

  # Scan configuration
  scan.partition.discovery.interval = "10s"

  # Lookup configuration
  lookup.async = true

  # Additional Fluss configuration (client, table, and performance options)
  fluss.config = {
    # Client options
    "client.id" = "seatunnel-fluss-source"
    "connection.timeout.ms" = "30000"
    "request.timeout.ms" = "30000"
    "retry.times" = "3"
    "retry.interval.ms" = "1000"

    # Consumer options
    "group.id" = "my_consumer_group"
    "fetch.size" = "1000"
    "poll.timeout.ms" = "5000"

    # Table options
    "table.log.retention.ms" = "86400000"
    "table.compaction.enabled" = "true"
  }
}

# Example 7: Batch processing configuration
# For batch jobs, typically use earliest or timestamp mode
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "analytics"
  table = "events"
  scan.startup.mode = "earliest"

  fluss.config = {
    # Higher parallelism and larger fetch size for batch processing
    "scan.parallelism" = "8"
    "fetch.size" = "2000"
    "enable.changelog" = "false"
  }
}

# Example 8: Real-time streaming configuration
# For streaming jobs, typically use latest or full mode
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "realtime"
  table = "user_events"
  scan.startup.mode = "latest"
  enable.changelog = true   # Enable changelog for streaming
  consumer.group = "realtime_processor"
  poll.timeout.ms = 1000    # Lower timeout for real-time processing
}

# Example 9: Data recovery configuration
# For recovering data from a specific point in time
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "production"
  table = "transactions"
  scan.startup.mode = "timestamp"
  scan.startup.timestamp = "2023-12-01 00:00:00"  # Start of December 2023
  enable.changelog = true
  consumer.group = "data_recovery_job"
}

# Example 10: Development and testing configuration
# For development, often want to see all data
source {
  plugin_name = "Fluss"
  bootstrap.servers = "localhost:9092"
  database = "test"
  table = "sample_data"
  scan.startup.mode = "earliest"

  fluss.config = {
    # Single parallelism for easier debugging
    "scan.parallelism" = "1"
    # Smaller fetch size for testing
    "fetch.size" = "100"
    # Longer timeout for debugging
    "poll.timeout.ms" = "10000"
    "enable.changelog" = "false"
  }
}
