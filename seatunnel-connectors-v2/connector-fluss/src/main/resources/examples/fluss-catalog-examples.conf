# Fluss Catalog Configuration Examples
# This file demonstrates various ways to configure the Fluss catalog
# for metadata operations and table discovery.

# Example 1: Basic catalog configuration
# Minimal configuration for Fluss catalog
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9092"
  default-database = "my_database"
}

# Example 2: Catalog with custom settings
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9092"
  default-database = "production"
  case-sensitive = false
  
  # Cache configuration for better performance
  metadata.cache.ttl.ms = 600000  # 10 minutes
  metadata.cache.size = 2000
  
  # Connection pool settings
  connection.pool.size = 20
}

# Example 3: Catalog with Fluss client configuration
catalog {
  type = "Fluss"
  bootstrap.servers = "fluss-cluster-1:9092,fluss-cluster-2:9092,fluss-cluster-3:9092"
  default-database = "analytics"
  
  # Fluss client configuration
  fluss.config = {
    "client.id" = "seatunnel-catalog"
    "connection.timeout.ms" = "30000"
    "request.timeout.ms" = "30000"
    "retry.times" = "3"
    "retry.interval.ms" = "1000"
    
    # Security configuration (if needed)
    # "security.protocol" = "SASL_SSL"
    # "sasl.mechanism" = "PLAIN"
    # "sasl.username" = "catalog_user"
    # "sasl.password" = "catalog_password"
  }
}

# Example 4: Development catalog configuration
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9092"
  default-database = "dev"
  case-sensitive = false
  
  # Faster cache refresh for development
  metadata.cache.ttl.ms = 60000  # 1 minute
  metadata.cache.size = 100
  
  # Smaller connection pool for development
  connection.pool.size = 5
  
  fluss.config = {
    "client.id" = "dev-catalog"
    "connection.timeout.ms" = "10000"
    "request.timeout.ms" = "10000"
  }
}

# Example 5: Production catalog with high availability
catalog {
  type = "Fluss"
  bootstrap.servers = "fluss-prod-1:9092,fluss-prod-2:9092,fluss-prod-3:9092"
  default-database = "production"
  case-sensitive = true  # Strict naming in production
  
  # Long cache TTL for stable production metadata
  metadata.cache.ttl.ms = 1800000  # 30 minutes
  metadata.cache.size = 5000
  
  # Large connection pool for high concurrency
  connection.pool.size = 50
  
  fluss.config = {
    "client.id" = "prod-catalog"
    "connection.timeout.ms" = "60000"
    "request.timeout.ms" = "60000"
    "retry.times" = "5"
    "retry.interval.ms" = "2000"
    
    # Production monitoring
    "metrics.enabled" = "true"
    "metrics.interval.ms" = "30000"
  }
}

# Example 6: Multi-region catalog configuration
catalog {
  type = "Fluss"
  bootstrap.servers = "region1-fluss:9092,region2-fluss:9092,region3-fluss:9092"
  default-database = "global"
  
  # Moderate cache settings for multi-region
  metadata.cache.ttl.ms = 300000  # 5 minutes
  metadata.cache.size = 1000
  connection.pool.size = 30
  
  fluss.config = {
    "client.id" = "multi-region-catalog"
    "connection.timeout.ms" = "45000"
    "request.timeout.ms" = "45000"
    "retry.times" = "10"
    "retry.interval.ms" = "3000"
    
    # Multi-region specific settings
    "socket.connection.setup.timeout.ms" = "30000"
    "socket.connection.setup.timeout.max.ms" = "120000"
  }
}

# Example 7: Catalog with disabled caching
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9092"
  default-database = "realtime"
  
  # Disable caching for real-time metadata
  metadata.cache.ttl.ms = 0  # Disabled
  metadata.cache.size = 0    # Disabled
  
  connection.pool.size = 10
  
  fluss.config = {
    "client.id" = "realtime-catalog"
    "connection.timeout.ms" = "5000"
    "request.timeout.ms" = "5000"
  }
}

# Example 8: Testing catalog configuration
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9092"
  default-database = "test"
  case-sensitive = false
  
  # Minimal cache for testing
  metadata.cache.ttl.ms = 30000  # 30 seconds
  metadata.cache.size = 50
  connection.pool.size = 2
  
  fluss.config = {
    "client.id" = "test-catalog"
    "connection.timeout.ms" = "5000"
    "request.timeout.ms" = "5000"
    "retry.times" = "1"
    "retry.interval.ms" = "500"
    
    # Debug settings for testing
    "debug" = "all"
    "log.level" = "DEBUG"
  }
}

# Example 9: Complete catalog configuration with all options
catalog {
  type = "Fluss"
  
  # Required connection settings
  bootstrap.servers = "fluss-1:9092,fluss-2:9092,fluss-3:9092"
  
  # Catalog settings
  default-database = "enterprise"
  case-sensitive = true
  
  # Performance settings
  metadata.cache.ttl.ms = 900000  # 15 minutes
  metadata.cache.size = 10000
  connection.pool.size = 100
  
  # Comprehensive Fluss configuration
  fluss.config = {
    # Client identification
    "client.id" = "enterprise-catalog"
    
    # Connection settings
    "connection.timeout.ms" = "60000"
    "request.timeout.ms" = "60000"
    "retry.times" = "5"
    "retry.interval.ms" = "2000"
    
    # Network settings
    "socket.connection.setup.timeout.ms" = "30000"
    "socket.connection.setup.timeout.max.ms" = "120000"
    "socket.keepalive.enable" = "true"
    
    # Performance settings
    "buffer.memory" = "134217728"  # 128MB
    "compression.type" = "lz4"
    
    # Monitoring and metrics
    "metrics.enabled" = "true"
    "metrics.interval.ms" = "30000"
    "metrics.num.samples" = "10"
    
    # Security (uncomment if needed)
    # "security.protocol" = "SASL_SSL"
    # "sasl.mechanism" = "SCRAM-SHA-256"
    # "sasl.username" = "catalog_user"
    # "sasl.password" = "secure_password"
    # "ssl.truststore.location" = "/path/to/truststore.jks"
    # "ssl.truststore.password" = "truststore_password"
  }
}

# Example 10: Catalog configuration for data discovery
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9092"
  default-database = "discovery"
  case-sensitive = false
  
  # Optimized for metadata browsing
  metadata.cache.ttl.ms = 120000  # 2 minutes
  metadata.cache.size = 500
  connection.pool.size = 15
  
  fluss.config = {
    "client.id" = "discovery-catalog"
    "connection.timeout.ms" = "15000"
    "request.timeout.ms" = "15000"
    "retry.times" = "3"
    "retry.interval.ms" = "1000"
    
    # Optimized for metadata operations
    "metadata.max.age.ms" = "60000"
    "metadata.refresh.backoff.ms" = "100"
    "metadata.refresh.backoff.max.ms" = "1000"
  }
}
