# Fluss Catalog Configuration Examples
# This file demonstrates various ways to configure the Fluss catalog
# for metadata operations and table discovery.

# Example 1: Basic catalog configuration (Recommended)
# Minimal configuration for Fluss catalog following official Flink connector design
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9123"
  default-database = "my_database"
}

# Example 2: Catalog with custom default database
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9123"
  default-database = "production"
}

# Example 3: Catalog with multiple Fluss servers
catalog {
  type = "Fluss"
  bootstrap.servers = "fluss-cluster-1:9123,fluss-cluster-2:9123,fluss-cluster-3:9123"
  default-database = "analytics"
}

# Example 4: Development catalog configuration
catalog {
  type = "Fluss"
  bootstrap.servers = "localhost:9123"
  default-database = "dev"
}

# Example 5: Production catalog with high availability
catalog {
  type = "Fluss"
  bootstrap.servers = "fluss-prod-1:9123,fluss-prod-2:9123,fluss-prod-3:9123"
  default-database = "production"
}

# Note: The Fluss catalog now follows the official Fluss Flink connector design
# for simplicity and consistency. Only bootstrap.servers and default-database
# are the main configuration options needed.
