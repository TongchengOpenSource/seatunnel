# Fluss Sink Configuration Example

env {
  execution.parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    parallelism = 1
    result.table.name = "fake"
    row.num = 1000
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
        timestamp = "bigint"
      }
    }
  }
}

transform {
  # If you need any transformations
}

sink {
  Fluss {
    bootstrap.servers = "localhost:9092"
    database = "test_db"
    table = "test_table"
    
    # Write configuration
    write.mode = "append"  # append, upsert
    batch.size = 1000
    batch.timeout.ms = 5000
    max.retries = 3
    
    # Transaction configuration
    enable.transaction = true
    transaction.timeout = "15min"
    enable.exactly.once = false
    transactional.id.prefix = "seatunnel-fluss"
    
    # Connection configuration
    connection.timeout.ms = 30000
    request.timeout.ms = 30000
    retry.times = 3
    retry.interval.ms = 1000
    
    # Additional Fluss configuration
    # fluss.config = {
    #   "custom.property" = "value"
    # }
  }
}
