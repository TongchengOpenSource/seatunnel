# Fluss Source with Timestamp Startup Mode Example

env {
  execution.parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 10000
}

source {
  Fluss {
    bootstrap.servers = "localhost:9123"
    database = "analytics"
    table = "user_events"
    
    # Define the schema
    schema = {
      fields {
        user_id = "string"
        event_type = "string"
        event_time = "timestamp"
        page_url = "string"
        session_id = "string"
      }
    }
    
    # Start reading from a specific timestamp using Admin listOffsets
    scan.startup.mode = "timestamp"
    scan.startup.timestamp = 1640995200000  # 2022-01-01 00:00:00 UTC in milliseconds
    # The connector will use Admin.listOffsets(OffsetSpec.forTimestamp()) to find the exact offset
    
    # Performance settings
    fetch.size = 2000
    poll.timeout.ms = 1000
    scan.parallelism = 2
    
    # Streaming configuration
    enable.changelog = true
    consumer.group = "timestamp-reader"
    
    # Connection settings
    connection.timeout.ms = 30000
    request.timeout.ms = 30000
    retry.times = 3
    retry.interval.ms = 1000
  }
}

transform {
  # Filter events after the specified timestamp
  Sql {
    sql = """
      SELECT 
        user_id,
        event_type,
        event_time,
        page_url,
        session_id,
        CURRENT_TIMESTAMP as processing_time
      FROM source
      WHERE event_time >= TIMESTAMP '2022-01-01 00:00:00'
    """
  }
}

sink {
  Console {
    # Print to console for demonstration
  }
}
