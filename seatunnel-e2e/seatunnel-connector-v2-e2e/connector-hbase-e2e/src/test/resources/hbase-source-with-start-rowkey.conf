env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Hbase {
    zookeeper_quorum = "hbase:2181"
    table = "seatunnel_test"
    namespace = "default"
    rowkey_columns = ["rowkey"]
    columns = [
      {
        name = "rowkey"
        type = "string"
      },
      {
        name = "info:name"
        type = "string"
      },
      {
        name = "info:age"
        type = "int"
      }
    ]
    start_rowkey = "user_100"
    is_binary_rowkey = false
  }
}

sink {
  Assert {
    source_table_name = "hbase"
    rules = {
      row_rules = [
        {
          rule_type = "MIN_ROW"
          rule_value = 1
        }
      ]
    }
  }
}